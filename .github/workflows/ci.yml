name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Go build, vet, test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the reference agent
        working-directory: agents/langgraph-reference
        run: pip install -r requirements.txt

      - name: Python tests (includes cross-language checks against the Go runner)
        working-directory: agents/langgraph-reference
        run: pytest -q

  schema:
    name: schema conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: JSON Schema stays in sync with the Go types
        run: go test ./trajectory/ -run "TestSchema" -v

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the schema validator
        working-directory: agents/langgraph-reference
        run: pip install -r requirements.txt

      - name: Fixtures and emitter output conform to the published JSON Schema
        working-directory: agents/langgraph-reference
        run: pytest -q tests/test_schema.py

  trazo-gate:
    name: trazo gate demo
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build the trazo binary
        run: go build -o trazo ./cmd/trazo

      - name: Gate passes on clean traces
        run: |
          echo "## trazo gate: clean traces" >> "$GITHUB_STEP_SUMMARY"
          ./trazo -dir testdata/ci/clean -format md >> "$GITHUB_STEP_SUMMARY"
          ./trazo -dir testdata/ci/clean
          echo "clean traces passed the gate (exit 0)"

      - name: Gate catches JudgmentBad
        run: |
          echo "## trazo gate: failing traces" >> "$GITHUB_STEP_SUMMARY"
          # This dump is expected to exit non-zero (there is a bad finding); it is
          # only for the report, so do not let set -e abort the step here.
          ./trazo -dir testdata/ci/failing -format md >> "$GITHUB_STEP_SUMMARY" || true
          # The real assertion: trazo must exit non-zero on the bad traces. The
          # if-condition is exempt from set -e, so a non-zero exit takes the else.
          if ./trazo -dir testdata/ci/failing; then
            echo "::error::trazo gate did not fail on a bad finding"
            exit 1
          fi
          echo "trazo correctly failed the pipeline on a bad finding (exit 1)"
